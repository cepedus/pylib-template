name: Tag and release
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Test template"]
    branches: [main]
    types:
      - completed

jobs:
  check-version:
    if: |
      startsWith(github.event.head_commit.message, '[RELEASE]') &&
      github.event.workflow_run.conclusion == 'success'
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      to_release: ${{ steps.verify-version.outputs.to_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Verify version
        id: verify-version
        run: |
          TAG=$(cat VERSION | xargs)
          if git show-ref --tags --verify --quiet "refs/tags/${TAG}"; then
            echo "Tag ${TAG} exists already exists. Cannot create a new release with the same version."
            exit 1
          else
            echo "Tag ${TAG} OK to create a new release."
            echo "to_release=${TAG}" >> $GITHUB_OUTPUT
          fi
  tag-and-release:
    name: Tag and release
    runs-on: ubuntu-latest
    needs: check-version
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Tag and release
        env:
          TAG: ${{ needs.check-version.outputs.to_release }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${TAG}" --title "${TAG}" --notes "Published by GitHub Actions workflow."
      