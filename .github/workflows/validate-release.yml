name: Validate release PR
on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

jobs:
  validate:
    name: VERSION bump required
    runs-on: ubuntu-latest
    if: startsWith(github.event.pull_request.title, '[RELEASE]')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect VERSION bump
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if ! git diff --name-only FETCH_HEAD HEAD -- | grep -qx VERSION; then
            echo "::error::PR title starts with [RELEASE] but VERSION was not modified."
            echo "::error::Either bump VERSION in this PR or drop the [RELEASE] prefix."
            exit 1
          fi
          echo "OK: VERSION was bumped in this PR."
